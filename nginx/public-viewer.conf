# Viewer-only entry point for the temporary HTTPS tunnel. No host port is opened.
server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/public/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        # Cloudflare supplies this header; never trust a visitor's X-Forwarded-For.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
    }

    location /hls/ {
        limit_except GET { deny all; }
        set $media http://mediamtx:8888;
        rewrite ^/hls/(.*)$ /$1 break;
        proxy_pass $media;
        proxy_cache off;
        add_header Cache-Control "no-store";
    }

    location ~ ^/(watch/[^/]+/?|assets/[^/]+|favicon\.ico)?$ {
        limit_except GET { deny all; }
        set $frontend http://frontend:80;
        proxy_pass $frontend;
    }

    location / { return 403; }
}
