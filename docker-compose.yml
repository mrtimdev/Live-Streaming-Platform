services:
  mysql:
    image: mysql:8.4
    container_name: livestream-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-livestream}
      MYSQL_USER: ${MYSQL_USER:-livestream}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-livestream_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    networks:
      - livestream_internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: livestream-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - livestream_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mediamtx:
    image: bluenviron/mediamtx:1.11.3
    container_name: livestream-mediamtx
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8888:8888"
      - "${MEDIAMTX_WEBRTC_BIND_IP:-127.0.0.1}:8189:8189/udp"
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_WEBRTC_HOST:-127.0.0.1}
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - livestream_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: livestream-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-livestream}
      MYSQL_USER: ${MYSQL_USER:-livestream}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-livestream_pass}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-change-in-production-at-least-32-chars}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin123}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@livestream.local}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      MEDIAMTX_API_URL: ${MEDIAMTX_API_URL:-http://mediamtx:9997}
      MEDIAMTX_WEBRTC_URL: http://mediamtx:8889
      MEDIAMTX_RTMP_PUBLIC_URL: ${MEDIAMTX_RTMP_PUBLIC_URL:-rtmp://localhost:1935/live}
      MEDIAMTX_HLS_PUBLIC_URL: ${MEDIAMTX_HLS_PUBLIC_URL:-/hls/live}
    networks:
      - livestream_internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: livestream-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - livestream_internal

volumes:
  mysql_data:
  redis_data:

networks:
  livestream_internal:
    driver: bridge
