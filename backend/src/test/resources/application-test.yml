spring:
  datasource:
    url: jdbc:h2:mem:livestream_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-at-least-32-characters-long-123456
  mediamtx:
    api-url: http://localhost:19997
    rtmp-public-url: rtmp://localhost:1935/live
    hls-public-url: http://localhost:8888/live
    monitor-interval-ms: 600000
