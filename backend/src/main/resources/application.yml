server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: live-streaming-platform

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:livestream}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:livestream}
    password: ${MYSQL_PASSWORD:livestream_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-in-production-at-least-32-chars}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:admin123}
    email: ${APP_ADMIN_EMAIL:admin@livestream.local}
  mediamtx:
    api-url: ${MEDIAMTX_API_URL:http://mediamtx:9997}
    rtmp-public-url: ${MEDIAMTX_RTMP_PUBLIC_URL:rtmp://localhost:1935/live}
    hls-public-url: ${MEDIAMTX_HLS_PUBLIC_URL:http://localhost:8888/live}
    monitor-interval-ms: 3000
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
  viewer:
    heartbeat-ttl-seconds: 45

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.company.livestream: INFO
    org.springframework.security: WARN
